name: Pipeline com dados reais
# Baixa as fontes públicas, treina e publica os resultados como artefato.
# Rodar em: Actions > "Pipeline com dados reais" > Run workflow
on:
  workflow_dispatch:
    inputs:
      retrain:
        description: "Ignorar o cache de dados brutos"
        type: boolean
        default: false
      safra_inicial:
        description: "Primeira safra analisada"
        default: "2014"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Cache dos dados brutos
        if: ${{ !inputs.retrain }}
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Baixar dados e treinar
        run: python -m src.pipeline --download 2>&1 | tee pipeline.log
        env:
          PROEX_SYNTHETIC: "0"
          PROEX_SAFRA_INICIAL: ${{ inputs.safra_inicial }}

      - name: Resumo
        if: always()
        run: |
          ls -la data/raw/garantia_safra | head -20 || true
          ls data/raw/chuva | wc -l || true
          cat reports/respostas.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados
          path: |
            data/processed/
            models/
            reports/
            pipeline.log
          retention-days: 30

      - name: Publicar resultados no branch "resultados"
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r data/processed models reports pipeline.log /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan resultados && git rm -rq --cached . && rm -rf -- * .github .streamlit .gitignore .dockerignore
          cp -r /tmp/out/* . && git add -f . && git commit -qm "Resultados do pipeline (${GITHUB_RUN_ID})"
          git push -f origin resultados
